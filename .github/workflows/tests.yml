# SPDX-License-Identifier: Apache-2.0
# The unit suite on Linux and macOS. macOS cannot pin CPUs and has no /proc: the suite must pass there with those facts reported, not assumed.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: "Unit tests (one way only: the package root is the top-level directory)"
        run: python3 -m unittest discover -s tests -t .
      - name: "The cgroup meter (Linux): the same suite's meter tests inside the user's systemd session"
        # A GitHub-hosted job runs under system.slice, where a process cannot be moved into a user scope (the first step runs the rusage fallback and says so). Inside `systemd-run --user --scope` the
        # runner and its meters' scopes share user@UID.service, so the tests that need a cgroup run for real and are not skipped.
        if: runner.os == 'Linux'
        run: |
          systemd-run --user --scope --quiet --collect -p MemoryAccounting=yes -p CPUAccounting=yes -- python3 -c "
          from buffon.runner import cgroup
          meter = cgroup.new_meter()
          print('meter:', meter.mode)
          meter.close()
          assert meter.mode == 'cgroup-systemd', meter.mode"
          systemd-run --user --scope --quiet --collect -p MemoryAccounting=yes -p CPUAccounting=yes -- python3 -m unittest -v tests.test_spawn_clock tests.test_schedstat tests.test_egress tests.test_measure
  signoff:
    # CONTRIBUTING.md: every commit, merge commits included, carries a Signed-off-by line (`git commit -s`, `git merge --signoff`).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit of the pull request has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -Eq '^Signed-off-by: .+ <.+>$'; then
              echo "no Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "fix: git rebase --signoff $BASE   (then git push --force-with-lease); next time use git commit -s and git merge --signoff"
            exit 1
          fi
