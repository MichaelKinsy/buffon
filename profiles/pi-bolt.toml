[[quotes]]
text = "Pi-Bolt is the Pi you already use, with the same commands, sessions, settings, providers and extensions. Every function is compiled to machine code when the executable is built, so nothing is parsed or JIT-compiled at launch."
source = "https://github.com/opensec-git/Pi-Bolt/blob/d82b859e811602994f482de351d941e2be9b63a5/README.md"
about = "design"

[[quotes]]
text = "It starts two to three times sooner than Pi on Bun and uses about a third of its CPU over a session; against Pi on Node it streams long answers and writes large files 18 to 100 times more cheaply."
source = "https://github.com/opensec-git/Pi-Bolt/blob/d82b859e811602994f482de351d941e2be9b63a5/README.md"
about = "performance"
