exe = "omp"

[endpoint]
apis = ["openai-completions", "anthropic-messages"]
writer = "writer.py"

[env]
PI_CODING_AGENT_DIR = "{agent_dir}"
# omp refreshes model catalogs from about six public hosts on every start (observed at 18.8.8; no offline switch exists). Every outbound request is sent to a closed local port instead;
# the mock endpoint is on NO_PROXY, which the harness sets for every arm. No connection leaves the machine, and the egress audit still checks that none does.
HTTPS_PROXY = "http://127.0.0.1:9"
HTTP_PROXY = "http://127.0.0.1:9"
ALL_PROXY = "http://127.0.0.1:9"

[state]
dirs = ["$HOME/.agent", "$XDG_CONFIG_HOME", "$XDG_DATA_HOME", "$XDG_CACHE_HOME", "$XDG_STATE_HOME"]

[seed]
# First start unpacks ~200 MB of native libraries into $HOME/.omp; a real user pays that once. The seed runs once in a scratch HOME (outside every measured sample, with the same blocked
# network) and is copied into each sample's HOME, so a sample measures a warm start.
command = ["{binary}", "--provider", "bench", "--model", "bench-1", "--no-session", "-p", "seed"]
timeout = 240
exclude = ["run", "tmp"]

[modes]
version = ["--version"]
print = ["--provider", "bench", "--model", "{model}", "--no-session", "-p", "{prompt}"]
pty = ["--provider", "bench", "--model", "{model}", "--no-session"]
rpc = ["--mode", "rpc", "--provider", "bench", "--model", "{model}", "--no-session"]

[cannot_run]

[capabilities]
pi_extensions = "partial"
pi_session_format = false

