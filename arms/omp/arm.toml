name = "omp"
label = "omp (oh-my-pi)"
homepage = "https://github.com/can1357/oh-my-pi"
relation = "pi-fork"
licence = "MIT"
licence_url = "https://github.com/can1357/oh-my-pi/blob/main/LICENSE"
restrictions = ""
version = "18.8.8"
caveat = "omp refreshes its model catalog from about six public hosts on every start and has no offline switch. Buffon sends those connections to a closed local port (proxy variables), so the refresh fails on every start: omp's startup numbers here are its failure path, not what a connected user sees. Nothing leaves the machine."
notes = "Pi-derived runtime with its own configuration (models.yml, config.yml). A one-time seed (see [seed]) gives each sample the warm state a real user has; whether a seeded start still connects out is checked by the egress audit on every sample."

