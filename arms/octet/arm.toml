sha256 = "c302fb238adfc94286dd8115b86b98f19f48e33536c4a156f6a207c82806a1c5"
checksums = "https://github.com/skaft-software/octet/releases/download/v0.9.4/OCTET_SHA256SUMS"
exe = "octet-0.9.4-aarch64-apple-darwin/octet"

[artifact.darwin-x64]
