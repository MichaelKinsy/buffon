url = "https://github.com/skaft-software/octet/releases/download/v0.9.4/octet-0.9.4-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "966e75a5551f46627080a4619383dbb402b5a72280a88e658bf2ce36e1059048"
checksums = "https://github.com/skaft-software/octet/releases/download/v0.9.4/OCTET_SHA256SUMS"
exe = "octet-0.9.4-x86_64-unknown-linux-gnu/octet"

