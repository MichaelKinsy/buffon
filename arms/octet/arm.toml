name = "octet"
label = "Octet"
homepage = "https://github.com/skaft-software/octet"
relation = "reference"
licence = "MIT"
licence_url = "https://github.com/skaft-software/octet/blob/v0.9.4/LICENSE"
restrictions = ""
version = "0.9.4"
notes = "Octet 0.9.4, the Rust coding agent from Skaft Software (MIT), stock release binary. Unrelated to Pi in code; its `--mode rpc` frames JSONL like Pi's (commands `prompt`, `get_state`, `get_commands`, events `agent_start`, `agent_end`, `tool_execution_end`) but the docs say it is not tested against a pinned Pi release. It reaches the mock only through its custom-provider registry (`~/.octet/credentials/custom.json`), which speaks OpenAI Chat Completions; the Anthropic and OpenAI providers are built in with fixed hosts, so Messages and Responses cannot be pointed at the mock. Full access is the default (no approval prompts). `OCTET_OFFLINE` skips model discovery, the models.dev refresh and the interactive start-up release check; the arm declares the model with its limits, so no `GET /models` is sent. The release is signed with Sigstore (keyless, GitHub Actions): the pinned archive hashes are those of `OCTET_SHA256SUMS`, whose signature was checked with cosign 3.1.3 the way `install-octet.sh` does (`verify-blob --bundle OCTET_SHA256SUMS.sigstore.json`, identity `release-octet.yml@refs/tags/v0.9.4`, workflow commit 7d31ad64). The task named v0.9.5, which has no published release (the repository version is 0.9.5 and the latest release tag is v0.9.4), so 0.9.4 is pinned."

