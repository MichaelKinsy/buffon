sha256 = "3fc90d92bac94d5668550c5670ee2b34496f36ee357f78ed7f1e04f3f06c7575"
checksums = "https://github.com/skaft-software/octet/releases/download/v0.9.4/OCTET_SHA256SUMS"
exe = "octet-0.9.4-x86_64-apple-darwin/octet"

[endpoint]
apis = ["openai-completions"]
writer = "writer.py"

[env]
OCTET_OFFLINE = "true"

[state]
dirs = ["$HOME/.octet"]

[modes]
version = ["--version"]
print = ["--no-session", "--model", "custom/bench/{model}", "-p", "{prompt}"]
rpc = ["--no-session", "--model", "custom/bench/{model}", "--mode", "rpc"]
pty = ["--tui-mode", "fullscreen", "--model", "custom/bench/{model}"]

[cannot_run]
print_session = "not wired: Octet keeps a session as its own durable graph under ~/.octet/sessions, addressed by a session id (`--session-id`, `--resume`), not as the Pi session file Buffon's `--session <file>` template names, so the kill-and-resume workloads cannot use it"
rpc_session = "not wired: its sessions are Octet's own durable graph, not Pi v3 session files, so the long-session and resume workloads have no equivalent"
rpc_resume = "not wired: its sessions are Octet's own durable graph, not Pi v3 session files, so a Pi session file cannot be resumed"
extensions = "Pi's TypeScript extensions are not loaded (the Pi compatibility adapter is experimental and not in the release), and the ten bench extensions cannot be realized in Octet's own subprocess protocol with the same results: its RPC `tool_execution_end` carries only the tool's text (`result` is `{content}`), never Pi's `details` (the bench tools return `details: {events}`), so the results cannot match Pi's byte for byte"

[capabilities]
pi_extensions = "none"
pi_session_format = false
exact_requests = true

[renderer]
pty = "fullscreen"
