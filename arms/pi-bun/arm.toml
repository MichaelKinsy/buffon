name = "pi-bun"
label = "Pi on Bun"
homepage = "https://github.com/earendil-works/pi"
relation = "pi-reference"
licence = "MIT"
licence_url = "https://github.com/earendil-works/pi/blob/v1.3.0/LICENSE"
restrictions = ""
version = "1.3.0"
notes = "Pi's own release binary (Bun runtime inside). A `bun build --compile` arm on a pinned Bun is a later addition."

[artifact.linux-x64]
url = "https://github.com/earendil-works/pi/releases/download/v1.3.0/pi-linux-x64.tar.gz"
sha256 = "24f5be328b66d4da36876296989501974f43ab8434fbb57c35c523a3ea505ded"
checksums = "https://github.com/earendil-works/pi/releases/download/v1.3.0/SHA256SUMS"
exe = "pi/pi"

[artifact.linux-arm64]
url = "https://github.com/earendil-works/pi/releases/download/v1.3.0/pi-linux-arm64.tar.gz"
sha256 = "7fd2ea14fca390ebf9f47438baaef07c4b3d13db7cc8e459831118391b7ea65b"
checksums = "https://github.com/earendil-works/pi/releases/download/v1.3.0/SHA256SUMS"
exe = "pi/pi"

[artifact.darwin-arm64]
url = "https://github.com/earendil-works/pi/releases/download/v1.3.0/pi-darwin-arm64.tar.gz"
sha256 = "1f9ae61cdeae04dd68caf1a1e8ab8ec9b292062f6ccb3252e0a9cbe93b5b16f1"
checksums = "https://github.com/earendil-works/pi/releases/download/v1.3.0/SHA256SUMS"
exe = "pi/pi"

[artifact.darwin-x64]
url = "https://github.com/earendil-works/pi/releases/download/v1.3.0/pi-darwin-x64.tar.gz"
sha256 = "9ff562e2e439f50971b1f6bd9b62b30946600d9e9baa4ea19635cf630a553066"
checksums = "https://github.com/earendil-works/pi/releases/download/v1.3.0/SHA256SUMS"
exe = "pi/pi"

[endpoint]
apis = ["openai-completions", "anthropic-messages", "openai-responses"]
writer = "writer.py"

[env]
PI_OFFLINE = "1"
PI_SKIP_VERSION_CHECK = "1"
PI_TELEMETRY = "0"
PI_CODING_AGENT_DIR = "{agent_dir}"

[state]
dirs = ["$HOME/.agent", "$HOME/.pig", "$XDG_CONFIG_HOME", "$XDG_DATA_HOME", "$XDG_CACHE_HOME", "$XDG_STATE_HOME"]

[modes]
version = ["--version"]
print = ["--provider", "bench", "--model", "{model}", "--no-session", "{extensions}", "-p", "{prompt}"]
print_session = ["--provider", "bench", "--model", "{model}", "--session", "{session}", "-p", "{prompt}"]
rpc = ["--mode", "rpc", "--provider", "bench", "--model", "{model}", "--no-session", "{extensions}"]
rpc_session = ["--mode", "rpc", "--provider", "bench", "--model", "{model}", "--session-dir", "{session_dir}", "{extensions}"]
rpc_resume = ["--mode", "rpc", "--provider", "bench", "--model", "{model}", "--session", "{session}", "{extensions}"]
pty = ["--provider", "bench", "--model", "{model}", "--no-session", "{extensions}"]

[capabilities]
pi_extensions = "native"
pi_session_format = true
exact_requests = true

[renderer]
pty = "fullscreen"
