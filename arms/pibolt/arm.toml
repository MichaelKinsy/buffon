name = "pibolt"
label = "Pi-Bolt"
homepage = "https://github.com/opensec-git/Pi-Bolt"
relation = "pi-fork"
licence = "MIT"
licence_url = "https://github.com/opensec-git/Pi-Bolt/blob/bolt-v0.9.3/LICENSE"
restrictions = ""
version = "0.9.3"
notes = "Pi-compatible runtime (AOT on Bun/JSC), stock linux-x64 build; Pi-Bolt 0.9.3 is Pi 1.3.0 compiled ahead of time, the same Pi version as the reference arm. It differs from Pi in three output paths (throttled tool-call argument events, `$$` Markdown lexing, alt-screen scroll regions), all still in the 0.9.3 source; since 0.9.2 a tool-call argument chunk also draws a frame only when the arguments shown change. A number on those paths is a number for different work. The checksums are signed with Pi-Bolt's Ed25519 release key (keys/release.pub; the same key is in its install.sh); the pinned SHA256SUMS signature was checked with OpenSSL 3 `pkeyutl -verify -rawin`."

[artifact.linux-x64]
url = "https://github.com/opensec-git/Pi-Bolt/releases/download/bolt-v0.9.3/pi-bolt-linux-x64.tar.gz"
sha256 = "333f44ab2a1f602dbeb36228927bcafabd3e132da32be1d6a7deb54bd09e90ce"
checksums = "https://github.com/opensec-git/Pi-Bolt/releases/download/bolt-v0.9.3/SHA256SUMS"
exe = "pi-bolt-linux-x64/pi"

[artifact.darwin-arm64]
url = "https://github.com/opensec-git/Pi-Bolt/releases/download/bolt-v0.9.3/pi-bolt-darwin-arm64.tar.gz"
sha256 = "a9f12db8785f76a4690049035643f47580c25ab1aef8c80f57762f2f96a4b945"
checksums = "https://github.com/opensec-git/Pi-Bolt/releases/download/bolt-v0.9.3/SHA256SUMS"
exe = "pi-bolt-darwin-arm64/pi"

[endpoint]
apis = ["openai-completions", "anthropic-messages", "openai-responses"]
writer = "writer.py"

[env]
PI_OFFLINE = "1"
PI_SKIP_VERSION_CHECK = "1"
PI_TELEMETRY = "0"
PI_CODING_AGENT_DIR = "{agent_dir}"

[state]
dirs = ["$HOME/.agent", "$HOME/.pig", "$XDG_CONFIG_HOME", "$XDG_DATA_HOME", "$XDG_CACHE_HOME", "$XDG_STATE_HOME"]

[modes]
version = ["--version"]
print = ["--provider", "bench", "--model", "{model}", "--no-session", "{extensions}", "-p", "{prompt}"]
print_session = ["--provider", "bench", "--model", "{model}", "--session", "{session}", "-p", "{prompt}"]
rpc = ["--mode", "rpc", "--provider", "bench", "--model", "{model}", "--no-session", "{extensions}"]
rpc_session = ["--mode", "rpc", "--provider", "bench", "--model", "{model}", "--session-dir", "{session_dir}", "{extensions}"]
rpc_resume = ["--mode", "rpc", "--provider", "bench", "--model", "{model}", "--session", "{session}", "{extensions}"]
pty = ["--provider", "bench", "--model", "{model}", "--no-session", "{extensions}"]

[capabilities]
pi_extensions = "native"
pi_session_format = true
exact_requests = true

[renderer]
pty = "fullscreen"

# Where Pi-Bolt does different work by its own account (docs/METHODOLOGY.md section 15). The report shows its median and does not compare it.
# overhead/print-write (the 200 KB write) stays scored: Pi-Bolt re-parses streamed tool arguments less often, but in print mode nothing shows those
# intermediate states, the file it writes is checked byte for byte, and the CPU it saves is the efficiency the workload measures.
[[divergence]]
workloads = ["streaming/tui-*"]
reason = "Pi-Bolt's fullscreen TUI scrolls the rows that only moved (a scroll region) and draws only the rows that changed"
source = "https://github.com/opensec-git/Pi-Bolt/blob/bolt-v0.9.3/packages/tui/src/tui-alt-screen.ts"
